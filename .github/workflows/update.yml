name: Statistiken aktualisieren

on:
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Seite erzeugen (bis zu 3 Versuche)
        run: |
          for i in 1 2 3; do python generate.py && exit 0; echo "Versuch $i fehlgeschlagen"; sleep 120; done; exit 1
        env:
          GROUP: "STSO S 2"
          TEAM: "Double Trouble Steeldarters"
      - name: Seite prüfen
        run: python pruefung.py
      - name: Änderungen speichern
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs daten
          git diff --cached --quiet || (git commit -m "Statistiken aktualisiert" && git pull --rebase -X theirs && git push)
