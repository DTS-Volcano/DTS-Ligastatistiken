<!doctype html><html lang="de-CH"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#17100f"><title>Flyer – Double Trouble Steeldarters</title><link rel="manifest" href="manifest.webmanifest">
<style>@font-face{font-family:Bebas;src:url(BebasNeue-Regular.ttf) format("truetype");font-display:block}:root{--bg:#f5f4f3;--ink:#1b1416;--mute:#675d60;--line:#ddd8d9;--green:#9a1b1c;--red:#9a1b1c;--win:#1d6a3e;--card:#fff;--hl:#f6e4e2;--top:#17100f;--topink:#f4eeee;--serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif}
@media (prefers-color-scheme:dark){:root{--bg:#141011;--ink:#eee8e8;--mute:#aa9fa2;--line:#2f2628;--green:#dd4a47;--red:#dd4a47;--win:#4fb27c;--card:#1d1618;--hl:#3a1d1e;--top:#0b0708}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif}
main{max-width:980px;margin:0 auto;padding:0 16px 48px}
h1{font-family:var(--serif);font-size:clamp(1.6rem,5vw,2.4rem);line-height:1.1;margin:0 0 4px;letter-spacing:-.01em;font-weight:700}
h2{font-family:var(--serif);font-size:1.3rem;margin:36px 0 8px;padding-bottom:6px;border-bottom:2px solid var(--ink)}
h3{font-size:1rem;margin:22px 0 6px}
.sub,.hint,footer{color:var(--mute);font-size:.9rem;margin:0 0 12px}
footer{margin-top:40px}
.top{background:var(--top);color:var(--topink);border-bottom:4px solid var(--green)}
.top .sub{color:#c9bcbe;margin:0}
.wrap{max-width:980px;margin:0 auto;padding:18px 16px}
.brand{display:flex;align-items:center;gap:16px}
.brand .logo{}
.logo{width:clamp(64px,16vw,96px);height:auto;flex:none}
.kpi{display:flex;flex-wrap:wrap;gap:12px 36px;margin:20px 0 0}
.kpi div{border-top:3px solid var(--green);padding-top:6px;min-width:84px}
.kpi dt{font-size:.8rem;color:var(--mute)}.kpi dd{margin:0;font-family:var(--serif);font-size:2rem;font-weight:700;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--mute);font-size:.82rem;border-bottom:2px solid var(--ink)}
.sortable th{cursor:pointer}.sortable th:hover,.sortable th:focus-visible{color:var(--ink)}
tfoot td{font-weight:700;border-top:2px solid var(--ink);border-bottom:0}
.num{text-align:right}
tr.hl td{background:var(--hl);font-weight:600}
.next{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--green);border-radius:8px;padding:4px 16px 16px;margin-top:28px}
.next h2{margin-top:14px}
.next .sub{margin:0 0 6px}
.dots{display:inline-flex;gap:3px;vertical-align:middle}
.dot{display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;border-radius:50%;font-size:.7rem;font-weight:700;color:#fff;cursor:default}
.dot.w{background:var(--win)}.dot.l{background:var(--red)}
@media (prefers-color-scheme:dark){.dot{color:#140c0d}}
.spark{vertical-align:middle;overflow:visible}
.spark polyline{fill:none;stroke:var(--win);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.spark circle{fill:var(--win)}
span.up,td.up{color:var(--win);font-weight:600}.down{color:var(--red);font-weight:600}
tr.click{cursor:pointer}tr.click:hover td{background:var(--hl)}
.rb{font:inherit;font-size:.82rem;color:var(--green);background:none;border:1px solid var(--green);border-radius:6px;padding:2px 10px;cursor:pointer}
.nav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
.tl{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left;font-weight:500;text-decoration:underline;text-decoration-color:color-mix(in srgb,currentColor 22%,transparent);text-decoration-thickness:1px;text-underline-offset:4px;transition:color .15s,text-decoration-color .15s}
.tl:hover,.tl:focus-visible{color:var(--green);text-decoration-color:var(--green);text-decoration-thickness:2px}
.dlg h4{margin:16px 0 6px;font-size:.95rem}
.rb[disabled]{opacity:.35;cursor:default}.rb[disabled]:hover{background:none;color:var(--green)}
.rb:hover{background:var(--green);color:var(--bg)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);padding:0;width:min(780px,calc(100vw - 20px));max-height:calc(100vh - 20px)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.dlg{padding:18px 18px 12px;position:relative}
.dlg .x{position:absolute;top:10px;right:10px;font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;width:34px;height:34px;cursor:pointer}
.vs{font-family:var(--serif);font-size:clamp(1.1rem,3.6vw,1.5rem);margin:2px 44px 4px 0;line-height:1.3}
.vs .sc{display:inline-block;padding:0 10px;margin:0 4px;border-radius:8px;background:var(--card);border:1px solid var(--line)}
.rounds{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px;margin-top:14px}
.rc{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px 8px}
.rc h4{display:flex;justify-content:space-between;margin:4px 0 6px;font-size:.9rem}
.rc h4 span{color:var(--mute);font-variant-numeric:tabular-nums}
.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:5px 0;border-top:1px solid var(--line);font-size:.9rem}
.pair .r{text-align:right}.pair small{color:var(--mute)}.pair .won{font-weight:700}
.pair .sc{font-variant-numeric:tabular-nums;white-space:nowrap}
a{color:var(--green)}
.js .panel{display:none}.js .panel.on{display:block}
.tabs{display:flex;gap:4px;position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin:0 -16px 0;padding:0 12px}
.tabs a{flex:1;text-align:center;padding:12px 8px;color:var(--mute);text-decoration:none;font-weight:600;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs a:hover{color:var(--ink)}.tabs a.on{color:var(--ink);border-bottom-color:var(--green)}
.res{list-style:none;margin:0;padding:0}
.resrow{all:unset;box-sizing:border-box;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.resrow:hover{background:var(--hl)}.resrow:focus-visible{outline:2px solid var(--green);outline-offset:-2px}
.resrow .rd{color:var(--mute);font-variant-numeric:tabular-nums}
.resrow small{display:block;color:var(--mute);font-size:.8rem}
.resrow .sc{font-family:var(--serif);font-size:1.3rem;font-variant-numeric:tabular-nums}
.sticky td:first-child,.sticky th:first-child{position:sticky;left:0;background:var(--bg);z-index:1}
.sticky tfoot td:first-child{background:var(--bg)}
@media (max-width:700px){
.tabs{position:fixed;top:auto;bottom:0;left:0;right:0;margin:0;padding:0 4px calc(env(safe-area-inset-bottom) + 0px);border-bottom:0;border-top:1px solid var(--line)}
.tabs a{border-bottom:0;border-top:3px solid transparent;margin:-1px 0 0;padding:14px 4px}
.tabs a.on{border-top-color:var(--green)}
main{padding-bottom:84px}
th,td{padding:7px 6px}
table.cards,table.cards tbody{display:block}
table.cards thead{display:none}
table.cards tr{display:grid;grid-template-columns:auto 1fr auto auto;grid-template-areas:"d o o p" "d c g b";gap:2px 10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}
table.cards td{border:0;padding:0;white-space:normal;text-align:left}
table.cards td:nth-child(1){grid-area:d;color:var(--mute)}
table.cards td:nth-child(2){grid-area:o;font-weight:600}
table.cards td:nth-child(3){grid-area:c;color:var(--mute);font-size:.85rem}
table.cards td:nth-child(4){grid-area:p;font-weight:700;font-size:1.05rem;text-align:right}
table.cards td:nth-child(5){grid-area:g;color:var(--mute);font-size:.85rem}
table.cards td:nth-child(5)::before{content:"Spiele "}
table.cards td:nth-child(6){grid-area:b;text-align:right}
table.cards.up tr{grid-template-areas:"d o o p" "d c g g"}
table.cards.up td:nth-child(3){grid-area:p;text-align:right;color:var(--mute);font-size:.85rem}
table.cards.up td:nth-child(3)::before{content:"Platz "}
table.cards.up td:nth-child(4){grid-area:c;font-weight:400;font-size:.85rem;color:var(--mute);text-align:left}
table.cards.up td:nth-child(5){grid-area:g;font-size:.85rem}
table.cards.up td:nth-child(5)::before{content:""}
}
.bar{display:inline-block;width:64px;height:8px;background:var(--red);border-radius:4px;margin-right:8px;vertical-align:middle;overflow:hidden}
.bar i{display:block;height:100%;background:var(--win)}
.q{display:inline-block;min-width:3.6em}
details{background:var(--card);border:1px solid var(--line);border-radius:8px;margin:0 0 8px}
summary{cursor:pointer;padding:10px 12px;display:flex;justify-content:space-between;gap:12px}
summary span{font-variant-numeric:tabular-nums;color:var(--mute)}
details[open] summary{border-bottom:1px solid var(--line)}
.win{color:var(--win);font-weight:700}.loss{color:var(--red);font-weight:600}
.win+.win,.win+.loss,.loss+.win,.loss+.loss{margin-left:6px}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.rk .bar{width:90px;display:block;margin:4px 0 2px}.rk div{padding-right:6px}.rk{font-size:.9rem}

tr.click td .tl{text-decoration:none;font-weight:600}
.head{display:flex;gap:14px;align-items:center;margin-right:44px}
.head .vs{margin:0}.head .sub{margin:0}
.pic{width:84px;height:84px;flex:none;border-radius:16px;object-fit:cover;border:3px solid var(--green);background:var(--card)}
.ini{display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:1.8rem;font-weight:700;color:var(--green)}
@media (min-width:700px){.pic{width:112px;height:112px}}
.prow{display:flex;align-items:center;gap:12px;margin:0 0 4px}
.ff{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ff ul{margin:0;padding-left:18px}.ff li{margin:2px 0}.ff small{color:var(--mute)}
dl.kpi.rk dd.win{color:var(--win)}dl.kpi.rk dd.loss{color:var(--red)}
.dlg .kpi{margin-top:14px}

.pcs{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.pc{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.pc .rk{grid-row:1;font-family:var(--serif);font-size:1.3rem;font-weight:700;min-width:2.2ch;text-align:center;color:var(--green)}
.pn{display:flex;flex-direction:column;line-height:1.25}.pn small{color:var(--mute)}
.pc .pf{grid-row:1}
.meet{grid-column:1/-1;margin:6px 0 0;padding-top:6px;border-top:1px dashed var(--line);display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;font-size:.85rem}
.meet small{color:var(--mute);margin-right:2px}
.chip{border:1px solid var(--line);border-radius:999px;padding:1px 9px;background:var(--card);white-space:nowrap}
.chip.win{border-color:var(--win);color:var(--win)}.chip.loss{border-color:var(--red);color:var(--red)}
.pc .rk{grid-column:1}.pc .pn{grid-column:2;grid-row:1}.pc .pf{grid-column:3;grid-row:1}

.potm{display:flex;gap:16px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--green);border-radius:10px;padding:14px 16px;margin-bottom:8px}
.potm .vs{margin:0}.potm .sub{margin:0}
.potm .pic{width:88px;height:88px}
.hof{list-style:none;margin:0;padding:0}
.hof li{display:flex;gap:12px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line)}
.hof li span{color:var(--mute);min-width:9.5em}.hof li b{margin-left:auto;font-variant-numeric:tabular-nums}

table.fx td.fxm{white-space:normal;line-height:1.35;width:100%}
table.fx td{vertical-align:middle}
.tabs a{white-space:nowrap}
@media (max-width:699px){.tabs a{font-size:.8rem;padding-inline:4px}}

.badges{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}
.badge{border:0;font-family:inherit;background:var(--ink);color:var(--bg);border-radius:999px;padding:3px 11px;font-size:.8rem;font-weight:600;letter-spacing:.01em;cursor:help}
.badge:focus-visible{outline:2px solid var(--green);outline-offset:2px}
#tip{position:fixed;z-index:10;max-width:240px;background:var(--ink);color:var(--bg);border-radius:8px;padding:8px 11px;font-size:.85rem;line-height:1.35;box-shadow:0 4px 16px #0005;pointer-events:none}
#tip[hidden]{display:none}
.badge.pm{background:var(--green);color:#fff}

.filter{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.filter input,.filter select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);min-width:0}
.filter input{flex:1 1 180px}.filter select{flex:0 1 auto}
.filter :focus-visible{outline:2px solid var(--green);outline-offset:1px}
tr[hidden]{display:none!important}

/* Kopfkarten Übersicht */
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:18px 0 0}
.hc{display:flex;flex-direction:column;gap:4px;background:var(--card);border:1px solid var(--line);border-top:3px solid var(--green);border-radius:10px;padding:12px 14px;text-align:left;font:inherit;color:inherit}
.hc p,.hc span{margin:0}.hc small{display:block;color:var(--mute);font-size:.85rem;margin-top:1px}
.hc .big{font-family:var(--serif);font-size:1.7rem;line-height:1.15}
.hc .dots{display:flex;gap:5px;margin:4px 0}
.hcb{cursor:pointer}.hcb:hover{border-color:var(--green)}
/* Suche, Hinweis */
.sbtn{margin-left:auto;font:inherit;font-size:.9rem;background:transparent;color:var(--topink);border:1px solid #ffffff55;border-radius:999px;padding:6px 14px;cursor:pointer;align-self:flex-start}
.sbtn:hover{border-color:#fff}
#s-in{width:100%;box-sizing:border-box;font:inherit;padding:10px 12px;margin:10px 0;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.sres{list-style:none;margin:0;padding:0}.sres li{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line)}
.sres small{color:var(--mute);text-align:right}
.stale{background:#7a2a2b;color:#fff;padding:8px 16px;font-size:.9rem;text-align:center}
.acts{display:flex;flex-wrap:wrap;gap:8px}
/* Bedienbarkeit */
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--green);outline-offset:2px}
@media (max-width:699px){
dialog{width:100%;max-width:none;margin:auto 0 0;border-radius:16px 16px 0 0;border-bottom:0;max-height:92vh}
dialog[open]{animation:sheet .22s ease-out}
.dlg::before{content:"";display:block;width:44px;height:4px;border-radius:2px;background:var(--line);margin:-8px auto 12px}
}
@keyframes sheet{from{transform:translateY(36px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){dialog[open]{animation:none}*{scroll-behavior:auto!important}}

dialog{touch-action:pan-y;overscroll-behavior:contain}
.scroll{touch-action:pan-x pan-y}
@keyframes inR{from{transform:translateX(48px);opacity:0}to{transform:none;opacity:1}}
@keyframes inL{from{transform:translateX(-48px);opacity:0}to{transform:none;opacity:1}}
dialog.in-r[open]{animation:inR .2s ease-out}dialog.in-l[open]{animation:inL .2s ease-out}

/* Diagramme */
.chart{width:100%;max-width:640px;height:auto;display:block;margin:2px 0 18px;overflow:visible}
.chart-n{display:none}
@media (max-width:699px){.chart-w{display:none}.chart-n{display:block}}
.ch-grid{stroke:var(--line);stroke-width:1}
.ch-t{fill:var(--mute);font-size:12px;font-family:inherit}
.ch-me{stroke:var(--green);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.ch-ref{stroke:var(--mute);stroke-width:2;stroke-dasharray:5 4}
.ch-dot{fill:var(--green);stroke:var(--bg);stroke-width:2}
.ch-bar{fill:var(--green);opacity:.85}.ch-bar:hover{opacity:1}
.ch-avg{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:5 4}
.ch-v{fill:var(--ink);font-size:11px;font-family:inherit;paint-order:stroke;stroke:var(--bg);stroke-width:3px;stroke-linejoin:round}
.ch-l{fill:var(--mute);font-size:12px;font-family:inherit;font-weight:600}.ch-l.me{fill:var(--ink)}
.lg{display:flex;flex-wrap:wrap;gap:4px 16px;margin:0 0 4px;font-size:.85rem;color:var(--mute)}
.lg span{display:inline-flex;align-items:center;gap:6px}
.lg .k{display:inline-block;width:22px;height:0;border-top:3px solid var(--green)}
.lg .k.ref{border-top:2px dashed var(--mute)}.lg .k.avg{border-top:2px dashed var(--ink)}
.lg .k.bar{height:10px;width:14px;border:0;background:var(--green);opacity:.85;border-radius:2px}
.hof-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.hf{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--green);border-radius:10px;padding:10px 12px}
.hf p{margin:2px 0}.hf small{display:block;color:var(--mute);font-size:.85rem}.hf .big{font-family:var(--serif);font-size:1.5rem;display:block;line-height:1.2}

.hf.mine{border-color:var(--green)}.hf .tl+small{margin-top:1px}
.jump{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:22px 0 8px}
.jt{display:block;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-decoration:none;color:var(--ink)}
.jt:hover{border-color:var(--green)}.jt b{display:block;font-family:var(--serif);font-size:1.05rem}.jt span{color:var(--mute);font-size:.85rem}
@media (min-width:700px){.jump{grid-template-columns:repeat(4,1fr)}}

.vfc{display:flex;flex:none}
.vfc img{height:clamp(44px,12vw,64px);width:auto;display:block}
.ovf{margin:14px 0 4px}

.two{display:grid;grid-template-columns:1fr;gap:0 28px}
@media (min-width:760px){.two{grid-template-columns:1fr 1fr}}
.res li.mn .ro,.res li.mn .rd{font-weight:700}.res li.mn{border-left:3px solid var(--green);padding-left:6px}

.imgprev{margin:12px 0;text-align:center}.imgprev img{max-width:min(100%,340px);height:auto;border-radius:10px;border:1px solid var(--line);display:block;margin:0 auto 10px}
.imgprev a.rb{text-decoration:none;display:inline-block}

#mtable tr.mn td:nth-child(2){color:var(--green)}
.filter select[hidden]{display:none}

details.calc{margin:14px 0;border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--card)}
details.calc summary{cursor:pointer;font-weight:600}
.calc .cg{display:grid;grid-template-columns:1fr;gap:8px;margin:8px 0}
.calc label{display:flex;justify-content:space-between;align-items:center;gap:10px}
.calc input{width:4.5rem;padding:6px 8px;font:inherit;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);text-align:right}
.calc .cr{margin:6px 0 0;line-height:1.55}

dl.info{display:grid;gap:8px;margin:12px 0}dl.info div{display:grid;grid-template-columns:9rem 1fr;gap:10px}dl.info dt{color:var(--mute)}dl.info dd{margin:0}
@media (max-width:520px){dl.info div{grid-template-columns:1fr;gap:0}}

.sbtn{margin-left:auto}
.pow{margin:24px 0 0;padding:16px 18px;display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--green);border-radius:12px;color:var(--ink)}
.pow img{width:auto;height:64px;flex:none}.pow>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.pow .pw{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}.pow .pn{font-size:1.2rem;line-height:1.25}.pow .mb{font-size:.95rem;color:var(--ink)}.pow .mb b{font-weight:700}

.tlg{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;flex:none;vertical-align:middle;margin-right:8px;border-radius:50%;overflow:hidden}
.tlg img{width:100%;height:100%;object-fit:contain;display:block}
.tlg.ph{background:hsl(var(--h) 45% 88%);color:hsl(var(--h) 55% 28%);font-size:.62rem;font-weight:700;letter-spacing:.02em}
.tlg.l{width:56px;height:56px;margin-right:14px;font-size:1.1rem}

.src{margin:14px 0 0;font-size:.85rem}

.fav[aria-pressed=true]{color:#ffd45a;border-color:#ffd45a}.fav:hover{border-color:#fff}
.filter #f-team,.filter #f-pt{display:none}

.filter[hidden]{display:none!important}

.hc,.hf,.jt,.potm,.pow{border-radius:var(--r);box-shadow:var(--sh)}
.hc,.hf{border-top:3px solid var(--green);padding:14px 16px}
.jt{padding:14px 16px;transition:border-color .15s,transform .15s}.jt:hover{transform:translateY(-1px)}
.hof-g{gap:12px}
/* Hinweise hinter «i» */
.tip{margin:12px 0 14px;font-size:.9rem;color:var(--mute)}
.tip summary{list-style:none;display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border:1px solid var(--line);border-radius:50%;cursor:pointer;font:italic 700 .8rem var(--serif);color:var(--mute);background:var(--card)}
.tip summary::-webkit-details-marker{display:none}.tip summary:hover,.tip[open] summary{border-color:var(--green);color:var(--ink)}
.tip p{margin:8px 0 0;max-width:62ch}
/* schlanke Startseite: Rekorde als Zeilen */
.hof-g.slim{display:block;border-top:1px solid var(--line)}
.hof-g.slim .hf{display:grid;grid-template-columns:1fr auto;gap:0 12px;align-items:baseline;border:0;border-bottom:1px solid var(--line);border-radius:0;box-shadow:none;background:transparent;padding:10px 4px}
.hof-g.slim .hf .sub{grid-column:1;margin:0}.hof-g.slim .hf .big{grid-column:2;grid-row:1/3;font-size:1.25rem;text-align:right}
.hof-g.slim .hf p:not(.sub){grid-column:1;margin:0}.hof-g.slim .hf small{display:none}

.tf{display:inline-flex;gap:3px;vertical-align:middle;margin-left:10px}
.fd{display:inline-block;width:9px;height:9px;border-radius:50%}.fd.w{background:var(--win)}.fd.l{background:var(--red)}
td .tf.under{display:flex;margin:5px 0 0 30px}
td:not(:first-child) .tf{margin-left:0}
/* Handy: Suche als schwebender Knopf in Daumenreichweite */
@media (max-width:699px){
.sbtn{position:fixed;right:14px;bottom:calc(64px + env(safe-area-inset-bottom));z-index:6;margin:0;padding:11px 18px;border-radius:999px;background:var(--top);color:var(--topink);border:1px solid #ffffff44;box-shadow:0 4px 14px #0000004d;font-weight:600}
.sbtn::before{content:"⌕ ";font-size:1.1em}
.clubbar{padding-bottom:12px}
main{padding-bottom:90px}
}

.skip{position:absolute;left:-999px;top:8px;background:#fff;color:#000;padding:8px 12px;border-radius:8px;z-index:20}.skip:focus{left:8px}
.sbtn:focus-visible,.fav:focus-visible,.club select:focus-visible{outline:2px solid #fff;outline-offset:2px}
#main:focus{outline:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}.jt:hover{transform:none}}
.tlg:not(.ph){background:#fff;box-shadow:inset 0 0 0 1px #0000001a}.tlg:not(.ph) img{padding:2px}

.dlg .th{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding-right:44px}

.tlg.xl{width:92px;height:92px;margin:0;flex:none;font-size:1.6rem}
